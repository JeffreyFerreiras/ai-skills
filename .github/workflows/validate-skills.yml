name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Install validator dependency
        run: python -m pip install PyYAML
      - name: Set up Windows skill discovery
        if: runner.os == 'Windows'
        run: ./scripts/setup-discovery.ps1
      - name: Validate repository skills
        run: python skills/skill-doctor/scripts/skill_doctor.py .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run code-review skill tests
        run: python -m unittest discover -s skills/code-review/tests -v
      - name: Run graph acceptance tests
        working-directory: skills/software-engineering-graph
        run: python -m unittest -v tests.test_contracts tests.test_planner tests.test_validator tests.test_state tests.test_cli tests.test_graph_hardening tests.test_reviewer_delegation
      - name: Verify graph hygiene last
        working-directory: skills/software-engineering-graph
        run: python -m unittest -v tests.test_standalone_acceptance.StandaloneAcceptanceTests.test_hygiene
